name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # macos-15 ships Xcode 16 (Swift 6); macos-14 only has Swift 5.10.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select --print-path
          swift --version
          xcodebuild -version

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/package.sh

      - name: Create zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent CursorBar.app "CursorBar-${VERSION}.zip"
          shasum -a 256 "CursorBar-${VERSION}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: CursorBar-*.zip
          generate_release_notes: true
